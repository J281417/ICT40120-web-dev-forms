<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Contact Us</title>
		<!-- <link rel="stylesheet" href="css/style.css">	 -->
		<link href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" rel="stylesheet">
	</head>

	<header style="background-color: white;">
		<nav class="navbar" role="navigation" aria-label="main navigation">
			<a class="navbar-item" href="./home.html"><strong>Cat Whats-The-Facts</strong></a>
			<a class="navbar-item" href="./home.html">Home</a>
			<a class="navbar-item" href="./about-us.html">About Us</a>
			<a class="navbar-item" href="./contact-us.html">Contact Us</a>
			<a class="navbar-item" href="./register.html">Register</a>
		</nav>
	</header>

	<body>
		<section class="section">
		<div class="container">
			<form action="#" method="post" id="theForm">
				<fieldset class="field">
					<legend class="title is-4">Contact us</legend>
					<!-- <p>All fields are required.</p> -->
					<div class="field">
						<label class="label" for="firstName">Name</label>
						<div class="control">
							<input class="input" class type="text" name="firstName" id="firstName">
						</div>
					</div>
					<div class="two">
						<label class="label" for="email">Email Address</label>
						<div class="control">
						<input class="input" type="email" name="email" id="email">
						</div>
					</div>
					<div class="two">
						<label class="label" for="message">Message</label>
						<div class="control">
							<textarea class="textarea" name="message" id="message" required></textarea>
						</div>
					</div>
					<div class="one">
						<label class="checkbox">
						<input type="checkbox" name="terms" id="terms" required>&nbsp;I agree to the terms, whatever
						they are.</div>
					<div class="field">
						<div class="control">
							<input
								type="submit"
								value="Submit"
								id="submit"
								class="button is-link"
							/>
						</div>
					</div>
				</fieldset>
			</form>
		</div>
		</section>

		<!-- register.html -->
		<script src="js/utilities.js"></script>
		<script src="js/errorMessages.js"></script>
		<script src="js/register.js"></script>
	</body>

</html>
